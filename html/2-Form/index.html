<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <div class="header">
        <h1 class="header__title">Регистрация</h1>
        <span class="header__question">Уже есть аккаунт?</span>
        <a href="#" class="header__link">Войти</a>
      </div>
      <form class="form">
        <input type="text" id="username" placeholder="Логин" class="field" />
        <div class="double-field">
          <input type="text" id="firstname" placeholder="Имя" class="field" />
          <input type="text" id="surname" placeholder="Фамилия" class="field" />
        </div>
        <input type="email" id="email" placeholder="E-mail" class="field" />
        <button type="submit" class="button">
          Зарегистрироваться
          <img src="./icons/arrow.svg" alt="Иконка стрелки">
        </button>
        <div>
          <input type="checkbox" id="permission" class="permission__checkbox" />
          <label for="permission" class="permission__text">Я прочитал и принимаю</label>
          <a href="#" class="permission__link">Условия использования</a>
        </div>
      </form>
    </main>
  </body>
</html>
